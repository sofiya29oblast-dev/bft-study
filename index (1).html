<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ИТ с нуля">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>ИТ с нуля</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="manifest" id="manifestLink" href="">
<style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #1c1c1e;
  --text-2: #6c6c70;
  --sep: rgba(60,60,67,.18);
  --blue: #007aff;
  --green: #34c759;
  --green-bg: rgba(52,199,89,.16);
  --red: #ff3b30;
  --red-bg: rgba(255,59,48,.14);
  --orange: #ff9500;
  --purple: #af52de;
  --code-bg: #f2f2f7;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1c1c1e;
    --text: #ffffff;
    --text-2: #98989f;
    --sep: rgba(84,84,88,.55);
    --blue: #0a84ff;
    --green: #30d158;
    --green-bg: rgba(48,209,88,.22);
    --red: #ff453a;
    --red-bg: rgba(255,69,58,.22);
    --orange: #ff9f0a;
    --purple: #bf5af2;
    --code-bg: #2c2c2e;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%; }
body { min-height: 100vh; min-height: 100dvh; }
#app { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 40px); }

/* Header */
.topbar { display: flex; align-items: center; min-height: 44px; margin-bottom: 8px; }
.back { background: none; border: 0; color: var(--blue); font-size: 17px; padding: 10px 8px 10px 0; cursor: pointer; font-family: inherit; }
.back:active { opacity: .5; }
h1.large { font-size: 34px; font-weight: 800; letter-spacing: -.5px; margin: 4px 0 18px; }
h2.title { font-size: 28px; font-weight: 800; letter-spacing: -.4px; margin: 4px 0 6px; }
.sub { color: var(--text-2); font-size: 15px; margin: 0 0 18px; line-height: 1.4; }

/* Cards */
.card { background: var(--card); border-radius: 22px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 16px; }
.progress-card { background: linear-gradient(135deg, #0a84ff, #5e5ce6); color: #fff; }
.progress-card .row { display: flex; justify-content: space-between; gap: 12px; }
.stat { flex: 1; }
.stat .num { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
.stat .lbl { font-size: 14px; opacity: .85; margin-top: 2px; }
.bar { height: 10px; background: rgba(255,255,255,.28); border-radius: 6px; margin-top: 18px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: #fff; border-radius: 6px; transition: width .5s ease; }

.module { display: block; width: 100%; text-align: left; border: 0; font-family: inherit; color: var(--text); cursor: pointer;
  background: var(--card); border-radius: 22px; padding: 22px; box-shadow: var(--shadow); margin-bottom: 16px; transition: transform .15s; }
.module:active { transform: scale(.98); }
.module .icon { width: 56px; height: 56px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 30px; margin-bottom: 14px; }
.module h3 { margin: 0 0 6px; font-size: 21px; letter-spacing: -.3px; }
.module p { margin: 0 0 14px; color: var(--text-2); font-size: 15px; line-height: 1.4; }
.chip { display: inline-block; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 20px; background: var(--code-bg); color: var(--text-2); }
.chip.ok { background: var(--green-bg); color: var(--green); }

/* Lesson list */
.lesson-item { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; font-family: inherit; color: var(--text);
  background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 12px; box-shadow: var(--shadow); cursor: pointer; min-height: 72px; }
.lesson-item:active { opacity: .6; }
.lesson-item .badge { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--code-bg); color: var(--text-2);
  display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; }
.lesson-item.done .badge { background: var(--green); color: #fff; }
.lesson-item .t { font-size: 17px; font-weight: 600; line-height: 1.3; }
.lesson-item .s { font-size: 14px; color: var(--text-2); margin-top: 2px; }
.lesson-item .arrow { margin-left: auto; color: var(--text-2); font-size: 22px; }

/* Theory */
.theory p { font-size: 17px; line-height: 1.55; margin: 0 0 14px; }
.theory p:last-child { margin-bottom: 0; }
.theory h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-2); }
code, pre { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
code { background: var(--code-bg); padding: 2px 6px; border-radius: 6px; font-size: 15px; }
pre { background: var(--code-bg); padding: 14px; border-radius: 14px; font-size: 14.5px; overflow-x: auto; margin: 0 0 14px; line-height: 1.5; -webkit-overflow-scrolling: touch; }
.tbl-wrap { overflow-x: auto; margin: 0 0 14px; border-radius: 14px; border: 1px solid var(--sep); }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--sep); white-space: nowrap; }
th { background: var(--code-bg); font-size: 13px; text-transform: uppercase; letter-spacing: .4px; color: var(--text-2); }
tr:last-child td { border-bottom: 0; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 14px; font-size: 14px; font-weight: 600; }
.flow span.st { background: var(--code-bg); padding: 7px 11px; border-radius: 20px; }
.flow span.ar { color: var(--text-2); }

/* Quiz */
.q-title { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--text-2); margin: 0 0 6px; }
.q-text { font-size: 19px; font-weight: 700; line-height: 1.35; margin: 0 0 14px; letter-spacing: -.2px; }
.opt { display: block; width: 100%; text-align: left; font-family: inherit; font-size: 17px; line-height: 1.35; color: var(--text);
  background: var(--code-bg); border: 2px solid transparent; border-radius: 16px; padding: 16px 18px; margin-bottom: 10px; cursor: pointer; min-height: 56px; transition: background .2s, border-color .2s, transform .1s; }
.opt:active:not(:disabled) { transform: scale(.98); }
.opt.correct { background: var(--green-bg); border-color: var(--green); color: var(--green); font-weight: 600; }
.opt.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red); font-weight: 600; }
.opt:disabled { cursor: default; }
.hint { display: none; margin: 4px 0 6px; padding: 12px 14px; border-radius: 14px; font-size: 15px; line-height: 1.45; }
.hint.show { display: block; }
.hint.bad { background: var(--red-bg); color: var(--red); }
.hint.good { background: var(--green-bg); color: var(--green); }
.pts { display: inline-block; font-weight: 700; }

/* Buttons */
.btn { display: block; width: 100%; font-family: inherit; font-size: 18px; font-weight: 700; color: #fff; background: var(--blue);
  border: 0; border-radius: 18px; padding: 18px; min-height: 58px; cursor: pointer; transition: transform .1s, opacity .2s; }
.btn:active { transform: scale(.98); opacity: .85; }
.btn.green { background: var(--green); }
.btn.ghost { background: transparent; color: var(--red); font-size: 15px; font-weight: 600; margin-top: 12px; }
.btn[disabled] { opacity: .45; }
.note { text-align: center; font-size: 14px; color: var(--text-2); margin: 10px 0 0; min-height: 20px; }
.shake { animation: shake .4s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }

/* Toast */
#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translate(-50%, 120px);
  background: rgba(40,40,45,.95); color: #fff; padding: 14px 22px; border-radius: 30px; font-size: 16px; font-weight: 600;
  transition: transform .35s cubic-bezier(.2,.9,.3,1.2); z-index: 10; max-width: 90%; text-align: center; }
#toast.show { transform: translate(-50%, 0); }
.view { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
/* ============ ДАННЫЕ КУРСА ============ */
const POINTS_PER_Q = 10;
const FINISH_BONUS = 10;

const MODULES = [
  {
    id: 'sql', icon: '🗄️', color: 'rgba(0,122,255,.15)',
    title: 'Модуль 1: Базы данных',
    subtitle: 'SQL для БФТ',
    desc: 'Учимся «разговаривать» с базой данных на языке SQL.',
    lessons: [
      {
        id: 'sql1', title: 'Что такое БД и зачем нужен SELECT', sub: 'Таблицы, строки, столбцы',
        theory: `
<p><b>База данных (БД)</b> — это организованное хранилище информации. Представьте огромную картотеку: в ней всё разложено по ящикам, и нужную карточку можно найти за секунду. В БД данные лежат в <b>таблицах</b>: столбцы — это свойства (имя, возраст), а строки — отдельные записи (один человек).</p>
<p>Вот пример таблицы <code>users</code>:</p>
<div class="tbl-wrap"><table>
<tr><th>id</th><th>name</th><th>age</th><th>city</th></tr>
<tr><td>1</td><td>Анна</td><td>25</td><td>Москва</td></tr>
<tr><td>2</td><td>Борис</td><td>34</td><td>Казань</td></tr>
<tr><td>3</td><td>Вера</td><td>41</td><td>Москва</td></tr>
<tr><td>4</td><td>Глеб</td><td>29</td><td>Самара</td></tr>
</table></div>
<p>Чтобы «достать» данные, используют команду <b>SELECT</b> — «выбери». Она читает данные и ничего не меняет и не удаляет. Формула простая: <code>SELECT что FROM откуда</code>.</p>
<pre>SELECT * FROM users;
-- звёздочка = все столбцы

SELECT name FROM users;
-- только столбец name: Анна, Борис, Вера, Глеб</pre>
<p>Так аналитики и тестировщики быстро проверяют, что именно лежит в базе, например, сохранился ли новый пользователь после регистрации.</p>`,
        quiz: [
          { q: 'Что такое база данных?', opts: ['Программа для рисования', 'Организованное хранилище данных в таблицах', 'Тип монитора'], correct: 1, hint: 'Вспомните картотеку: БД хранит информацию упорядоченно, в таблицах со строками и столбцами.' },
          { q: 'Что делает команда SELECT?', opts: ['Удаляет таблицу', 'Создаёт нового пользователя', 'Выбирает (читает) данные из таблицы'], correct: 2, hint: 'SELECT переводится как «выбрать». Она только читает данные и ничего не удаляет.' },
          { q: 'Что вернёт запрос  SELECT name FROM users;  ?', opts: ['Только столбец name всех пользователей', 'Все столбцы таблицы', 'Ошибку'], correct: 0, hint: 'После SELECT мы указываем нужные столбцы. Здесь это только name, значит, остальные не показываются.' }
        ]
      },
      {
        id: 'sql2', title: 'Фильтрация данных через WHERE', sub: 'Отбираем нужные строки',
        theory: `
<p>Обычно нужны не все строки, а только подходящие. Для этого после <code>FROM</code> добавляют <b>WHERE</b> — «где» и условие. База проверит каждую строку и покажет только те, что подходят.</p>
<pre>SELECT * FROM users
WHERE city = 'Москва';
-- вернёт: Анна и Вера</pre>
<p>Текст в SQL всегда пишется в <b>одинарных кавычках</b>: <code>'Москва'</code>. Числа пишутся без кавычек. Для чисел можно использовать сравнения: <code>&gt;</code> больше, <code>&lt;</code> меньше, <code>=</code> равно.</p>
<pre>SELECT name FROM users
WHERE age &gt; 30;
-- вернёт: Борис, Вера</pre>
<p>Условия можно объединять: <b>AND</b> — «и то, и другое», <b>OR</b> — «или». Например, <code>WHERE city = 'Москва' AND age &gt; 30</code> вернёт только Веру: она и из Москвы, и старше 30.</p>`,
        quiz: [
          { q: 'Для чего нужен оператор WHERE?', opts: ['Фильтрует строки по условию', 'Удаляет столбцы', 'Сортирует таблицу по алфавиту'], correct: 0, hint: 'WHERE переводится как «где». Он оставляет только те строки, которые подходят под условие.' },
          { q: 'Какой запрос вернёт пользователей старше 30 лет?', opts: ['SELECT * FROM users IF age > 30;', 'WHERE * FROM users SELECT age > 30;', 'SELECT * FROM users WHERE age > 30;'], correct: 2, hint: 'Порядок всегда такой: SELECT что → FROM откуда → WHERE условие.' },
          { q: 'Как правильно записать условие для города Москва?', opts: ["WHERE city = Москва", "WHERE city = 'Москва'", "WHERE city == [Москва]"], correct: 1, hint: 'Текстовые значения в SQL берут в одинарные кавычки, а знак сравнения — одинарное «=».' }
        ]
      }
    ]
  },
  {
    id: 'qa', icon: '🐞', color: 'rgba(255,149,0,.18)',
    title: 'Модуль 2: Тестирование ПО',
    subtitle: 'QA Manual',
    desc: 'Находим ошибки в программах и грамотно о них сообщаем.',
    lessons: [
      {
        id: 'qa1', title: 'Что такое баг и его жизненный цикл', sub: 'От обнаружения до закрытия',
        theory: `
<p><b>Баг (дефект)</b> — это расхождение между тем, как программа <i>должна</i> работать, и тем, как она работает на самом деле. Пример: на кнопку «Войти» нажали, а ничего не произошло. Ожидали вход в аккаунт, получили тишину — это баг.</p>
<p>У каждого бага есть <b>жизненный цикл</b> — путь по статусам, пока ошибка не будет побеждена:</p>
<div class="flow">
<span class="st">New</span><span class="ar">→</span><span class="st">Assigned</span><span class="ar">→</span><span class="st">In progress</span><span class="ar">→</span><span class="st">Fixed</span><span class="ar">→</span><span class="st">Retest</span><span class="ar">→</span><span class="st">Closed</span>
</div>
<p>Тестировщик находит баг и заводит его (<b>New</b>). Баг назначают разработчику, тот исправляет (<b>Fixed</b>), а тестировщик перепроверяет. Если всё хорошо — баг <b>Closed</b>. Если ошибка осталась — статус <b>Reopened</b>, и баг возвращается к разработчику.</p>`,
        quiz: [
          { q: 'Что такое баг?', opts: ['Новая функция приложения', 'Расхождение между ожидаемым и фактическим поведением программы', 'Название языка программирования'], correct: 1, hint: 'Баг — это когда программа делает не то, что должна. Ожидали одно, получили другое.' },
          { q: 'Какой статус у бага после исправления разработчиком, но до проверки тестировщиком?', opts: ['Closed', 'New', 'Fixed (ждёт перепроверки)'], correct: 2, hint: 'Закрыть баг может только тот, кто проверил исправление. Разработчик лишь отмечает, что исправил.' },
          { q: 'Тестировщик проверил исправление, но ошибка осталась. Что он делает?', opts: ['Закрывает баг', 'Переоткрывает баг (Reopened)', 'Удаляет баг из системы'], correct: 1, hint: 'Если ошибка не исправлена, баг возвращают разработчику со статусом Reopened.' }
        ]
      },
      {
        id: 'qa2', title: 'Как правильно составлять баг-репорт', sub: 'Чтобы поняли с первого раза',
        theory: `
<p><b>Баг-репорт</b> — это описание ошибки для разработчика. Хороший репорт понятен без лишних вопросов. Главное правило: пишите <b>конкретно и по фактам</b>. Плохо: «Не работает». Хорошо: «Кнопка „Войти“ не реагирует на нажатие на экране входа».</p>
<p>Обязательные части баг-репорта:</p>
<pre>Заголовок: Кнопка «Войти» не реагирует на нажатие
Шаги:
 1. Открыть приложение
 2. Ввести логин и пароль
 3. Нажать «Войти»
Ожидаемый результат: открывается главный экран
Фактический результат: ничего не происходит
Окружение: iPhone 13, iOS 17, версия 1.2.0</pre>
<p><b>Окружение</b> (устройство, система, версия) очень важно: на одном телефоне баг есть, а на другом нет. Хорошо добавить скриншот или видео и указать <b>приоритет</b> — насколько серьёзна ошибка. Тогда разработчик сразу сможет повторить проблему и быстро её исправить.</p>`,
        quiz: [
          { q: 'Какой заголовок баг-репорта самый удачный?', opts: ['Всё сломалось', 'Не работает', 'Кнопка «Войти» не реагирует на нажатие на iPhone 13, iOS 17'], correct: 2, hint: 'Хороший заголовок конкретный: ясно, что именно сломано и где.' },
          { q: 'Что такое «шаги воспроизведения»?', opts: ['Пошаговая инструкция, как повторить баг', 'Список сотрудников команды', 'План отпуска тестировщика'], correct: 0, hint: 'Разработчик должен суметь повторить ошибку у себя. Для этого нужны чёткие шаги.' },
          { q: 'Что нужно указать в разделе «Окружение»?', opts: ['Своё настроение и любимый цвет', 'Устройство, версию ОС и версию приложения', 'Фамилию разработчика'], correct: 1, hint: 'Окружение — это техническая среда, в которой найден баг: устройство, система, версия приложения.' }
        ]
      }
    ]
  }
];
const ALL_LESSONS = MODULES.flatMap(m => m.lessons);

/* ============ СОСТОЯНИЕ И LOCALSTORAGE ============ */
const KEY = 'it_learn_pwa_v1';
let state = loadState();

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && typeof s === 'object') return { done: s.done || {}, answers: s.answers || {}, points: s.points || 0, bonus: s.bonus || {} };
  } catch (e) {}
  return { done: {}, answers: {}, points: 0, bonus: {} };
}
function saveState() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
const doneCount = () => ALL_LESSONS.filter(l => state.done[l.id]).length;
const modDone = m => m.lessons.filter(l => state.done[l.id]).length;

/* ============ НАВИГАЦИЯ ============ */
const app = document.getElementById('app');
let route = { v: 'home' };

function go(r) {
  route = r;
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (route.v === 'home') return renderHome();
  if (route.v === 'module') return renderModule(MODULES.find(m => m.id === route.id));
  if (route.v === 'lesson') return renderLesson(route.id);
}

/* ============ ЭКРАНЫ ============ */
function renderHome() {
  const n = doneCount(), total = ALL_LESSONS.length;
  const pct = Math.round(n / total * 100);
  app.innerHTML = `
  <div class="view">
    <div class="topbar"></div>
    <h1 class="large">ИТ с нуля</h1>
    <div class="card progress-card">
      <div class="row">
        <div class="stat"><div class="num">${n} / ${total}</div><div class="lbl">Изучено уроков: ${n} из ${total}</div></div>
        <div class="stat" style="text-align:right"><div class="num">⭐ ${state.points}</div><div class="lbl">Набрано баллов: ${state.points}</div></div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    ${MODULES.map(m => {
      const d = modDone(m);
      return `<button class="module" data-mod="${m.id}">
        <div class="icon" style="background:${m.color}">${m.icon}</div>
        <h3>${m.title}</h3>
        <p>${m.subtitle}. ${m.desc}</p>
        <span class="chip ${d === m.lessons.length ? 'ok' : ''}">${d === m.lessons.length ? '✓ ' : ''}${d} из ${m.lessons.length} уроков</span>
      </button>`;
    }).join('')}
    <button class="btn ghost" id="resetBtn">Сбросить весь прогресс</button>
  </div>`;
  app.querySelectorAll('[data-mod]').forEach(b => b.onclick = () => go({ v: 'module', id: b.dataset.mod }));
  document.getElementById('resetBtn').onclick = () => {
    if (confirm('Удалить все баллы и прогресс? Это действие нельзя отменить.')) {
      state = { done: {}, answers: {}, points: 0, bonus: {} };
      saveState(); render(); toast('Прогресс сброшен');
    }
  };
}

function renderModule(m) {
  app.innerHTML = `
  <div class="view">
    <div class="topbar"><button class="back" id="back">‹ Назад</button></div>
    <h2 class="title">${m.icon} ${m.title}</h2>
    <p class="sub">${m.subtitle}. ${m.desc}</p>
    ${m.lessons.map((l, i) => `
      <button class="lesson-item ${state.done[l.id] ? 'done' : ''}" data-les="${l.id}">
        <div class="badge">${state.done[l.id] ? '✓' : i + 1}</div>
        <div><div class="t">${l.title}</div><div class="s">${state.done[l.id] ? 'Пройден' : l.sub}</div></div>
        <div class="arrow">›</div>
      </button>`).join('')}
  </div>`;
  document.getElementById('back').onclick = () => go({ v: 'home' });
  app.querySelectorAll('[data-les]').forEach(b => b.onclick = () => go({ v: 'lesson', id: b.dataset.les }));
}

function renderLesson(id) {
  const mod = MODULES.find(m => m.lessons.some(l => l.id === id));
  const l = ALL_LESSONS.find(x => x.id === id);
  const saved = state.answers[id] || {};
  const isDone = !!state.done[id];

  app.innerHTML = `
  <div class="view">
    <div class="topbar"><button class="back" id="back">‹ ${mod.subtitle}</button></div>
    <h2 class="title">${l.title}</h2>
    <p class="sub">${isDone ? '✓ Урок пройден' : 'Прочитайте теорию и ответьте на 3 вопроса'}</p>
    <div class="card theory"><h4>Теория</h4>${l.theory}</div>
    ${l.quiz.map((q, qi) => `
      <div class="card" data-q="${qi}">
        <div class="q-title">Вопрос ${qi + 1} из ${l.quiz.length} · +${POINTS_PER_Q} баллов</div>
        <div class="q-text">${q.q}</div>
        ${q.opts.map((o, oi) => `<button class="opt" data-o="${oi}">${o}</button>`).join('')}
        <div class="hint"></div>
      </div>`).join('')}
    <button class="btn green" id="finish">${isDone ? 'Урок завершён ✓' : 'Завершить урок'}</button>
    <div class="note" id="note"></div>
  </div>`;

  document.getElementById('back').onclick = () => go({ v: 'module', id: mod.id });

  // Восстановить уже решённые вопросы
  l.quiz.forEach((q, qi) => {
    if (saved[qi]) lockCorrect(qi, q, false);
  });

  // Обработчики ответов
  app.querySelectorAll('.card[data-q]').forEach(card => {
    const qi = +card.dataset.q, q = l.quiz[qi];
    card.querySelectorAll('.opt').forEach(btn => {
      btn.onclick = () => {
        const oi = +btn.dataset.o;
        if ((state.answers[id] || {})[qi]) return;
        if (oi === q.correct) {
          if (!state.answers[id]) state.answers[id] = {};
          state.answers[id][qi] = true;
          state.points += POINTS_PER_Q;
          saveState();
          lockCorrect(qi, q, true);
          toast(`+${POINTS_PER_Q} баллов! 🎉`);
        } else {
          btn.classList.add('wrong'); btn.disabled = true;
          const h = card.querySelector('.hint');
          h.className = 'hint bad show';
          h.textContent = '💡 Подсказка: ' + q.hint;
          card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
          if (navigator.vibrate) navigator.vibrate(60);
        }
      };
    });
  });

  // Завершение урока
  document.getElementById('finish').onclick = () => {
    const a = state.answers[id] || {};
    const allOk = l.quiz.every((_, i) => a[i]);
    const note = document.getElementById('note');
    if (!allOk) {
      note.textContent = 'Сначала ответьте правильно на все вопросы теста.';
      note.style.color = 'var(--red)';
      const b = document.getElementById('finish');
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      return;
    }
    if (!state.done[id]) {
      state.done[id] = true;
      if (!state.bonus[id]) { state.bonus[id] = true; state.points += FINISH_BONUS; }
      saveState();
      toast(`Урок завершён! +${FINISH_BONUS} бонус 🏆`);
    }
    setTimeout(() => go({ v: 'module', id: mod.id }), 700);
  };

  function lockCorrect(qi, q, animate) {
    const card = app.querySelector(`.card[data-q="${qi}"]`);
    card.querySelectorAll('.opt').forEach((b, i) => {
      b.disabled = true;
      b.classList.remove('wrong');
      if (i === q.correct) b.classList.add('correct');
    });
    const h = card.querySelector('.hint');
    h.className = 'hint good show';
    h.textContent = '✅ Верно!';
  }
}

/* ============ УТИЛИТЫ ============ */
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* Иконка и манифест генерируются на лету, чтобы всё было в одном файле */
(function setupPWA() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    const g = x.createLinearGradient(0, 0, 180, 180);
    g.addColorStop(0, '#0a84ff'); g.addColorStop(1, '#5e5ce6');
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    x.fillStyle = '#fff'; x.font = 'bold 74px -apple-system, Helvetica, Arial';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('</>', 90, 94);
    const icon = c.toDataURL('image/png');
    document.getElementById('touchIcon').href = icon;
    const manifest = {
      name: 'ИТ с нуля', short_name: 'ИТ с нуля', display: 'standalone',
      background_color: '#f2f2f7', theme_color: '#007aff', start_url: location.href.split('#')[0],
      icons: [{ src: icon, sizes: '180x180', type: 'image/png' }]
    };
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('manifestLink').href = URL.createObjectURL(blob);
  } catch (e) {}
})();

render();
</script>
